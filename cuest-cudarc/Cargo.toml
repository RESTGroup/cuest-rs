[package]
name = "cuest-cudarc"
description = "Safe Rust wrapper for cuEST built on cudarc"
readme = "readme.md"

rust-version.workspace = true
version = "0.1.0"
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
cuest-ffi = { workspace = true }
# cudarc: no hardcoded CUDA version feature — auto-detect from `nvcc` (or
# `CUDARC_CUDA_VERSION` env var). If neither is available, `fallback-latest`
# picks the newest supported version so the build doesn't fail on machines
# without a CUDA toolkit installed at compile time.
cudarc = { version = "0.19", default-features = false, features = [
    "driver", "std", "runtime",
    "cuda-version-from-build-system", "fallback-latest",
    "fallback-dynamic-loading",
] }

[dev-dependencies]
toml = { version = "1.1" }

[features]
default = ["dynamic_loading"]

# Dynamic library loading support (default); forward to `cuest-ffi`.
# Disabling this feature (with `--no-default-features`) selects static linking.
dynamic_loading = ["cuest-ffi/dynamic_loading"]

[package.metadata.docs.rs]
features = ["dynamic_loading"]
rustdoc-args = ["--cfg", "docsrs"]
